<script>
  function loadScript(src, onFail) {
    const script = document.createElement('script');
    script.src = src;
    if (onFail) script.onerror = onFail;
    document.body.appendChild(script);
  }

  loadScript(
    "https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js",
    function () {
      console.warn("unpkg indisponible, chargement de la version locale de Sveltia CMS");
      loadScript("/admin/sveltia-cms.js");
    }
  );
</script>
